<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-RHR Protocol</title>
    <meta name="theme-color" content="#09090b">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#09090b', 
                        surface: 'rgba(24, 24, 27, 0.6)', 
                        surfaceBorder: 'rgba(255, 255, 255, 0.1)',
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Segoe UI"', 'Roboto', 'sans-serif'],
                        mono: ['"SF Mono"', 'Menlo', 'Monaco', 'Courier New', 'monospace'],
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <style>
        body { 
            background-color: #09090b; 
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.04) 0%, transparent 50%);
            color: #f4f4f5; 
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        ::-webkit-scrollbar { display: none; }
        
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin: 12px 0;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 3px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            box-shadow: 0 0 10px var(--thumb-shadow, rgba(255,255,255,0.2));
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        .slider-dynamic::-webkit-slider-thumb { 
            background: var(--thumb-color, #fff); 
            border: 2px solid #09090b;
            box-shadow: 0 0 12px var(--thumb-color, rgba(255,255,255,0.2));
        }

        .glass-card {
            background: rgba(24, 24, 27, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        const useLocalStorage = (key, initialValue) => {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.error(error);
                }
            };
            return [storedValue, setValue];
        };

        const getScheduleForMode = (mode) => {
            const baseSchedules = {
                'Balanced': [
                    { day: 'Sun', type: 'Endurance Base', desc: 'Long steady state. Target cardiac hypertrophy.', baseVol: 60, maxVol: 90 },
                    { day: 'Mon', type: 'Anaerobic Cap', desc: '4x4m Intervals (Z5) with 3m rest.', baseVol: 30, maxVol: 35 },
                    { day: 'Tue', type: 'Zone 2 Flush', desc: 'Light spin/jog for strict metabolite clearance.', baseVol: 40, maxVol: 45 },
                    { day: 'Wed', type: 'Strength (Lower)', desc: 'Heavy structural loading. Primary squat/hinge.', baseVol: 45, maxVol: 45 },
                    { day: 'Thu', type: 'Strength (Upper)', desc: 'Upper mechanics. Push/pull hypertrophy ranges.', baseVol: 45, maxVol: 45 },
                    { day: 'Fri', type: 'HIIT / Sprint', desc: 'Maximum output bursts. Full recovery between sets.', baseVol: 20, maxVol: 20 },
                    { day: 'Sat', type: 'Neural Rest', desc: 'Zero structured physical load. Pure recovery.', baseVol: 0, maxVol: 0 }
                ],
                'Aerobic Focus': [
                    { day: 'Sun', type: 'Endurance Engine', desc: 'Extended low-intensity volume. Nasal strict.', baseVol: 90, maxVol: 120 },
                    { day: 'Mon', type: 'Anaerobic Cap', desc: '4x4m Intervals (Z5) with 3m rest.', baseVol: 35, maxVol: 40 },
                    { day: 'Tue', type: 'Zone 2 Base', desc: 'Strict Nasal Breathing steady state.', baseVol: 60, maxVol: 75 },
                    { day: 'Wed', type: 'Strength Maint.', desc: 'Full body mobility and compound maintenance.', baseVol: 30, maxVol: 30 },
                    { day: 'Thu', type: 'Zone 2 Flush', desc: 'Light spin/jog.', baseVol: 45, maxVol: 50 },
                    { day: 'Fri', type: 'HIIT / Sprint', desc: 'Max output, full recovery.', baseVol: 20, maxVol: 20 },
                    { day: 'Sat', type: 'Neural Rest', desc: 'Zero structured load.', baseVol: 0, maxVol: 0 }
                ],
                'Strength Focus': [
                    { day: 'Sun', type: 'Zone 2 Base', desc: 'Active recovery. Nasal only.', baseVol: 45, maxVol: 50 },
                    { day: 'Mon', type: 'Strength (Lower)', desc: 'Squat/Hinge primary focus. Heavy load.', baseVol: 60, maxVol: 70 },
                    { day: 'Tue', type: 'Zone 2 Flush', desc: 'Light active recovery to clear metabolites.', baseVol: 30, maxVol: 30 },
                    { day: 'Wed', type: 'Strength (Upper)', desc: 'Push/Pull primary focus. Hypertrophy ranges.', baseVol: 60, maxVol: 70 },
                    { day: 'Thu', type: 'Anaerobic Maint.', desc: 'Short sprint intervals for engine preservation.', baseVol: 20, maxVol: 25 },
                    { day: 'Fri', type: 'Power / Full Body', desc: 'Explosive movements, plyometrics.', baseVol: 45, maxVol: 50 },
                    { day: 'Sat', type: 'Neural Rest', desc: 'Zero structured load.', baseVol: 0, maxVol: 0 }
                ]
            };
            return baseSchedules[mode] || baseSchedules['Balanced'];
        };

        const calculateDailyProtocol = (workout, currentHRV, baseHRV) => {
            if (workout.baseVol === 0) return { volume: 0, state: 'Recovery', colorHex: '#a1a1aa', textClass: 'text-zinc-400', instruction: workout.desc, bgGlow: 'rgba(161, 161, 170, 0.03)' };

            const percentChange = (currentHRV - baseHRV) / baseHRV; 
            
            if (percentChange >= 0.08) {
                return { 
                    volume: workout.maxVol, 
                    state: 'Hyper-Ready', 
                    colorHex: '#10b981', // Emerald 500
                    textClass: 'text-emerald-400',
                    instruction: `${workout.desc} System optimized. Extend volume or push peak output today.`,
                    bgGlow: 'rgba(16, 185, 129, 0.05)'
                };
            } else if (percentChange <= -0.08) {
                const penaltyMultiplier = Math.max(0.5, 1 + percentChange); 
                return { 
                    volume: Math.round(workout.baseVol * penaltyMultiplier), 
                    state: 'Under-Recovered', 
                    colorHex: '#f43f5e', // Rose 500
                    textClass: 'text-rose-400',
                    instruction: `High sympathetic drive detected. Cap effort intensity and prioritize structural recovery.`,
                    bgGlow: 'rgba(244, 63, 94, 0.05)'
                };
            }
            
            return { 
                volume: workout.baseVol, 
                state: 'Baseline', 
                colorHex: '#0ea5e9', // Sky 500
                textClass: 'text-sky-400',
                instruction: workout.desc,
                bgGlow: 'rgba(14, 165, 233, 0.03)'
            };
        };

        const App = () => {
            const [baseHRV, setBaseHRV] = useLocalStorage('rhr_baseHRV', 117);
            const [dailyHRV, setDailyHRV] = useLocalStorage('rhr_dailyHRV', 127);
            const [trainingMode, setTrainingMode] = useLocalStorage('rhr_trainingMode', 'Balanced');
            
            const currentDayIndex = new Date().getDay();
            const activeSchedule = getScheduleForMode(trainingMode);
            const todayWorkout = activeSchedule[currentDayIndex];
            const activeProtocol = calculateDailyProtocol(todayWorkout, dailyHRV, baseHRV);
            
            const tomorrowIndex = (currentDayIndex + 1) % 7;
            const tomorrowWorkout = activeSchedule[tomorrowIndex];

            useEffect(() => {
                document.documentElement.style.setProperty('--thumb-color', activeProtocol.colorHex);
                document.documentElement.style.setProperty('--thumb-shadow', `${activeProtocol.colorHex}66`);
            }, [activeProtocol.colorHex]);

            return (
                <div className="min-h-screen p-5 md:p-8 flex flex-col items-center max-w-[440px] mx-auto pb-20 font-sans">
                    
                    {/* Header */}
                    <header className="w-full mb-10 mt-4 flex justify-between items-center">
                        <div>
                            <h1 className="text-xl font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-zinc-100 to-zinc-400">
                                Neuro-RHR
                            </h1>
                            <div className="text-[10px] text-zinc-500 font-bold uppercase tracking-widest mt-0.5">Protocol Dashboard</div>
                        </div>
                        
                        <div className="relative group">
                            <select 
                                value={trainingMode} 
                                onChange={(e) => setTrainingMode(e.target.value)}
                                className="appearance-none bg-zinc-900/50 border border-zinc-800 text-zinc-300 py-2 pl-4 pr-9 rounded-lg text-xs font-semibold focus:outline-none focus:border-zinc-600 focus:ring-1 focus:ring-zinc-600 transition-all cursor-pointer hover:bg-zinc-800/50"
                            >
                                <option value="Balanced">Balanced Base</option>
                                <option value="Aerobic Focus">Aerobic Block</option>
                                <option value="Strength Focus">Strength Block</option>
                            </select>
                            <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-zinc-500 group-hover:text-zinc-300 transition-colors">
                                <svg className="fill-current h-4 w-4" viewBox="0 0 20 20">
                                    <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
                                </svg>
                            </div>
                        </div>
                    </header>

                    {/* Readiness Panel - THICKENED FONTS */}
                    <section className="w-full glass-card rounded-2xl p-6 mb-6">
                        <div className="flex justify-between items-end mb-8">
                            <div>
                                <h2 className="text-[11px] font-bold text-zinc-400 uppercase tracking-widest mb-1.5">System State</h2>
                                <div className={`text-lg font-bold tracking-wide flex items-center gap-2 ${activeProtocol.textClass}`}>
                                    <div className="w-2 h-2 rounded-full" style={{ backgroundColor: activeProtocol.colorHex, boxShadow: `0 0 10px ${activeProtocol.colorHex}` }}></div>
                                    {activeProtocol.state}
                                </div>
                            </div>
                            <div className="text-right">
                                <div className="text-[11px] font-bold text-zinc-400 uppercase tracking-widest mb-1.5">Variance</div>
                                <div className="text-xl font-mono font-bold text-zinc-100">
                                    {((dailyHRV - baseHRV) / baseHRV * 100) > 0 ? '+' : ''}{((dailyHRV - baseHRV) / baseHRV * 100).toFixed(1)}%
                                </div>
                            </div>
                        </div>
                        
                        <div className="space-y-7">
                            <div className="relative">
                                <div className="flex justify-between text-sm mb-2">
                                    <span className="text-zinc-400 font-semibold">Baseline HRV (14d)</span>
                                    <span className="font-mono font-bold text-zinc-300">{baseHRV} <span className="text-xs text-zinc-600 font-semibold">ms</span></span>
                                </div>
                                <input 
                                    type="range" min="30" max="150" value={baseHRV} 
                                    onChange={(e) => setBaseHRV(Number(e.target.value))}
                                />
                            </div>
                            
                            <div className="relative">
                                <div className="flex justify-between text-sm mb-2">
                                    <span className="text-zinc-200 font-semibold">Morning RMSSD</span>
                                    <span className={`font-mono font-bold ${activeProtocol.textClass}`}>{dailyHRV} <span className="text-xs opacity-50 font-semibold">ms</span></span>
                                </div>
                                <input 
                                    type="range" min="30" max="150" value={dailyHRV} 
                                    onChange={(e) => setDailyHRV(Number(e.target.value))}
                                    className="slider-dynamic"
                                />
                            </div>
                        </div>
                    </section>

                    {/* Protocol Card */}
                    <AnimatePresence mode="wait">
                        <motion.section 
                            key={trainingMode + currentDayIndex + activeProtocol.state}
                            initial={{ y: 15, opacity: 0, scale: 0.98 }}
                            animate={{ y: 0, opacity: 1, scale: 1 }}
                            exit={{ y: -10, opacity: 0, scale: 0.98 }}
                            transition={{ duration: 0.4, ease: [0.23, 1, 0.32, 1] }}
                            className="w-full glass-card rounded-2xl p-6 relative overflow-hidden flex flex-col justify-between min-h-[200px]"
                            style={{
                                background: `linear-gradient(145deg, rgba(24, 24, 27, 0.6) 0%, ${activeProtocol.bgGlow} 100%)`
                            }}
                        >
                            <div>
                                <h2 className="text-[11px] font-bold text-zinc-400 uppercase tracking-widest mb-3">Today • {todayWorkout.day}</h2>
                                <h3 className="text-2xl font-bold text-zinc-100 mb-3 tracking-tight">
                                    {todayWorkout.type}
                                </h3>
                                <p className="text-zinc-400 text-sm font-medium leading-relaxed max-w-[95%]">
                                    {activeProtocol.instruction}
                                </p>
                            </div>
                            
                            <div className="mt-8 pt-5 border-t border-zinc-800/50 flex items-end justify-between">
                                <div>
                                    <span className="text-[10px] text-zinc-500 uppercase font-bold tracking-widest block mb-1">Target Volume</span>
                                    {activeProtocol.volume > 0 ? (
                                        <div className="flex items-baseline space-x-1.5">
                                            <span className={`text-4xl font-mono font-bold tracking-tight ${activeProtocol.textClass}`}>
                                                {activeProtocol.volume}
                                            </span>
                                            <span className="text-xs text-zinc-500 uppercase font-bold">Min</span>
                                        </div>
                                    ) : (
                                        <span className={`text-2xl font-mono font-bold tracking-tight ${activeProtocol.textClass}`}>
                                            REST
                                        </span>
                                    )}
                                </div>
                            </div>
                        </motion.section>
                    </AnimatePresence>

                    {/* Tomorrow Preview */}
                    <section className="w-full mt-5">
                        <div className="w-full bg-zinc-900/40 border border-zinc-800/60 rounded-xl p-4 flex items-center justify-between hover:bg-zinc-900/60 transition-colors">
                            <div className="flex items-center space-x-3.5">
                                <div className="w-8 h-8 rounded-full bg-zinc-800/50 flex items-center justify-center">
                                    <svg className="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path>
                                    </svg>
                                </div>
                                <div>
                                    <h4 className="text-[10px] text-zinc-500 uppercase tracking-widest font-bold mb-0.5">Tomorrow</h4>
                                    <span className="text-sm font-bold text-zinc-300">{tomorrowWorkout.type}</span>
                                </div>
                            </div>
                            <div className="text-right">
                                <span className="text-sm font-mono font-bold text-zinc-400">
                                    {tomorrowWorkout.baseVol > 0 ? `${tomorrowWorkout.baseVol}m` : 'REST'}
                                </span>
                            </div>
                        </div>
                    </section>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
