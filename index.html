<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-RHR Protocol</title>
    <meta name="theme-color" content="#0a0a0a">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: '#0a0a0a',
                        surface: '#121212',
                        surfaceBorder: 'rgba(255, 255, 255, 0.08)',
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Segoe UI"', 'Roboto', 'sans-serif'],
                        mono: ['"SF Mono"', 'Menlo', 'Monaco', 'Courier New', 'monospace'],
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <style>
        body { 
            background-color: #0a0a0a; 
            color: #ececec; 
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        ::-webkit-scrollbar { display: none; }
        
        /* Ultra-minimal sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin: 10px 0;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 1px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
        }
        input[type=range]::-webkit-slider-thumb {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -5px;
            transition: transform 0.2s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }
        .slider-dynamic::-webkit-slider-thumb { background: var(--thumb-color, #fff); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        const useLocalStorage = (key, initialValue) => {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.error(error);
                }
            };
            return [storedValue, setValue];
        };

        const getScheduleForMode = (mode) => {
            const baseSchedules = {
                'Balanced': [
                    { day: 'Sun', type: 'Endurance Base', desc: 'Long steady state. Target cardiac hypertrophy.', baseVol: 60, maxVol: 90 },
                    { day: 'Mon', type: 'Anaerobic Cap', desc: '4x4m Intervals (Z5) with 3m rest.', baseVol: 30, maxVol: 35 },
                    { day: 'Tue', type: 'Zone 2 Flush', desc: 'Light spin/jog for strict metabolite clearance.', baseVol: 40, maxVol: 45 },
                    { day: 'Wed', type: 'Strength (Lower)', desc: 'Heavy structural loading. Primary squat/hinge.', baseVol: 45, maxVol: 45 },
                    { day: 'Thu', type: 'Strength (Upper)', desc: 'Upper mechanics. Push/pull hypertrophy ranges.', baseVol: 45, maxVol: 45 },
                    { day: 'Fri', type: 'HIIT / Sprint', desc: 'Maximum output bursts. Full recovery between sets.', baseVol: 20, maxVol: 20 },
                    { day: 'Sat', type: 'Neural Rest', desc: 'Zero structured physical load. Pure recovery.', baseVol: 0, maxVol: 0 }
                ],
                'Aerobic Focus': [
                    { day: 'Sun', type: 'Endurance Engine', desc: 'Extended low-intensity volume. Nasal strict.', baseVol: 90, maxVol: 120 },
                    { day: 'Mon', type: 'Anaerobic Cap', desc: '4x4m Intervals (Z5) with 3m rest.', baseVol: 35, maxVol: 40 },
                    { day: 'Tue', type: 'Zone 2 Base', desc: 'Strict Nasal Breathing steady state.', baseVol: 60, maxVol: 75 },
                    { day: 'Wed', type: 'Strength Maint.', desc: 'Full body mobility and compound maintenance.', baseVol: 30, maxVol: 30 },
                    { day: 'Thu', type: 'Zone 2 Flush', desc: 'Light spin/jog.', baseVol: 45, maxVol: 50 },
                    { day: 'Fri', type: 'HIIT / Sprint', desc: 'Max output, full recovery.', baseVol: 20, maxVol: 20 },
                    { day: 'Sat', type: 'Neural Rest', desc: 'Zero structured load.', baseVol: 0, maxVol: 0 }
                ],
                'Strength Focus': [
                    { day: 'Sun', type: 'Zone 2 Base', desc: 'Active recovery. Nasal only.', baseVol: 45, maxVol: 50 },
                    { day: 'Mon', type: 'Strength (Lower)', desc: 'Squat/Hinge primary focus. Heavy load.', baseVol: 60, maxVol: 70 },
                    { day: 'Tue', type: 'Zone 2 Flush', desc: 'Light active recovery to clear metabolites.', baseVol: 30, maxVol: 30 },
                    { day: 'Wed', type: 'Strength (Upper)', desc: 'Push/Pull primary focus. Hypertrophy ranges.', baseVol: 60, maxVol: 70 },
                    { day: 'Thu', type: 'Anaerobic Maint.', desc: 'Short sprint intervals for engine preservation.', baseVol: 20, maxVol: 25 },
                    { day: 'Fri', type: 'Power / Full Body', desc: 'Explosive movements, plyometrics.', baseVol: 45, maxVol: 50 },
                    { day: 'Sat', type: 'Neural Rest', desc: 'Zero structured load.', baseVol: 0, maxVol: 0 }
                ]
            };
            return baseSchedules[mode] || baseSchedules['Balanced'];
        };

        const calculateDailyProtocol = (workout, currentHRV, baseHRV) => {
            if (workout.baseVol === 0) return { volume: 0, state: 'Recovery', colorHex: '#71717a', textClass: 'text-zinc-500', instruction: workout.desc };

            const percentChange = (currentHRV - baseHRV) / baseHRV; 
            
            if (percentChange >= 0.08) {
                return { 
                    volume: workout.maxVol, 
                    state: 'Hyper-Ready', 
                    colorHex: '#34d399',
                    textClass: 'text-emerald-400',
                    instruction: `${workout.desc} System optimized. Extend volume or output.`
                };
            } else if (percentChange <= -0.08) {
                const penaltyMultiplier = Math.max(0.5, 1 + percentChange); 
                return { 
                    volume: Math.round(workout.baseVol * penaltyMultiplier), 
                    state: 'Under-Recovered', 
                    colorHex: '#fb7185',
                    textClass: 'text-rose-400',
                    instruction: `High sympathetic drive. Cap intensity. Focus on structural recovery.`
                };
            }
            
            return { 
                volume: workout.baseVol, 
                state: 'Baseline', 
                colorHex: '#f4f4f5',
                textClass: 'text-zinc-100',
                instruction: workout.desc
            };
        };

        const App = () => {
            const [baseHRV, setBaseHRV] = useLocalStorage('rhr_baseHRV', 65);
            const [dailyHRV, setDailyHRV] = useLocalStorage('rhr_dailyHRV', 65);
            const [trainingMode, setTrainingMode] = useLocalStorage('rhr_trainingMode', 'Balanced');
            
            const currentDayIndex = new Date().getDay();
            const activeSchedule = getScheduleForMode(trainingMode);
            const todayWorkout = activeSchedule[currentDayIndex];
            const activeProtocol = calculateDailyProtocol(todayWorkout, dailyHRV, baseHRV);
            
            const tomorrowIndex = (currentDayIndex + 1) % 7;
            const tomorrowWorkout = activeSchedule[tomorrowIndex];

            useEffect(() => {
                document.documentElement.style.setProperty('--thumb-color', activeProtocol.colorHex);
            }, [activeProtocol.colorHex]);

            return (
                <div className="min-h-screen p-6 md:p-10 flex flex-col items-center max-w-md mx-auto pb-20 font-sans">
                    
                    {/* Header */}
                    <header className="w-full mb-12 mt-4 flex justify-between items-center">
                        <div>
                            <h1 className="text-xl font-light tracking-widest text-white uppercase">
                                Neuro-RHR
                            </h1>
                            <div className="text-[9px] text-zinc-500 font-medium uppercase tracking-[0.2em] mt-1">Protocol Dashboard</div>
                        </div>
                        
                        <div className="relative">
                            <select 
                                value={trainingMode} 
                                onChange={(e) => setTrainingMode(e.target.value)}
                                className="appearance-none bg-surface border border-surfaceBorder text-zinc-300 py-1.5 pl-3 pr-8 rounded-md text-[10px] font-medium uppercase tracking-wider focus:outline-none focus:border-zinc-500 transition-colors cursor-pointer"
                            >
                                <option value="Balanced">Balanced</option>
                                <option value="Aerobic Focus">Aerobic</option>
                                <option value="Strength Focus">Strength</option>
                            </select>
                            <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-zinc-500">
                                <svg className="fill-current h-3 w-3" viewBox="0 0 20 20">
                                    <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
                                </svg>
                            </div>
                        </div>
                    </header>

                    {/* Readiness Panel */}
                    <section className="w-full mb-10">
                        <div className="flex justify-between items-end mb-8">
                            <div>
                                <h2 className="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">State</h2>
                                <div className={`text-sm font-medium uppercase tracking-widest ${activeProtocol.textClass}`}>
                                    {activeProtocol.state}
                                </div>
                            </div>
                            <div className="text-right">
                                <div className="text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Variance</div>
                                <div className="text-sm font-mono text-zinc-300">
                                    {((dailyHRV - baseHRV) / baseHRV * 100).toFixed(1)}%
                                </div>
                            </div>
                        </div>
                        
                        <div className="space-y-6">
                            <div className="relative">
                                <div className="flex justify-between text-[11px] mb-2 uppercase tracking-wide">
                                    <span className="text-zinc-500">Baseline HRV</span>
                                    <span className="font-mono text-zinc-400">{baseHRV}</span>
                                </div>
                                <input 
                                    type="range" min="30" max="150" value={baseHRV} 
                                    onChange={(e) => setBaseHRV(Number(e.target.value))}
                                />
                            </div>
                            
                            <div className="relative">
                                <div className="flex justify-between text-[11px] mb-2 uppercase tracking-wide">
                                    <span className="text-zinc-300">Morning RMSSD</span>
                                    <span className={`font-mono ${activeProtocol.textClass}`}>{dailyHRV}</span>
                                </div>
                                <input 
                                    type="range" min="30" max="150" value={dailyHRV} 
                                    onChange={(e) => setDailyHRV(Number(e.target.value))}
                                    className="slider-dynamic"
                                />
                            </div>
                        </div>
                    </section>

                    {/* Protocol Card */}
                    <AnimatePresence mode="wait">
                        <motion.section 
                            key={trainingMode + currentDayIndex + activeProtocol.state}
                            initial={{ y: 10, opacity: 0 }}
                            animate={{ y: 0, opacity: 1 }}
                            exit={{ y: -10, opacity: 0 }}
                            transition={{ duration: 0.3, ease: "easeOut" }}
                            className="w-full bg-surface border border-surfaceBorder rounded-xl p-6 relative flex flex-col justify-between min-h-[200px]"
                        >
                            <div>
                                <h2 className="text-[10px] text-zinc-500 uppercase tracking-widest mb-4">Today's Protocol</h2>
                                <h3 className="text-xl font-light text-zinc-100 mb-3 tracking-wide">
                                    {todayWorkout.type}
                                </h3>
                                <p className="text-zinc-400 text-sm font-light leading-relaxed">
                                    {activeProtocol.instruction}
                                </p>
                            </div>
                            
                            <div className="mt-8 pt-4 border-t border-surfaceBorder flex items-end justify-between">
                                <div>
                                    <span className="text-[9px] text-zinc-500 uppercase tracking-widest block mb-1">Target</span>
                                    {activeProtocol.volume > 0 ? (
                                        <div className="flex items-baseline space-x-1">
                                            <span className={`text-3xl font-mono font-light ${activeProtocol.textClass}`}>
                                                {activeProtocol.volume}
                                            </span>
                                            <span className="text-[10px] text-zinc-500 uppercase tracking-wide ml-1">Min</span>
                                        </div>
                                    ) : (
                                        <span className={`text-xl font-mono font-light ${activeProtocol.textClass}`}>
                                            Rest
                                        </span>
                                    )}
                                </div>
                            </div>
                        </motion.section>
                    </AnimatePresence>

                    {/* Tomorrow Preview */}
                    <section className="w-full mt-4">
                        <div className="w-full border border-surfaceBorder rounded-lg p-4 flex items-center justify-between text-zinc-400">
                            <div className="flex items-center space-x-3">
                                <div>
                                    <h4 className="text-[9px] uppercase tracking-widest mb-1">Tomorrow</h4>
                                    <span className="text-xs font-medium tracking-wide text-zinc-300">{tomorrowWorkout.type}</span>
                                </div>
                            </div>
                            <div className="text-right">
                                <span className="text-xs font-mono">
                                    {tomorrowWorkout.baseVol > 0 ? `${tomorrowWorkout.baseVol}m` : 'REST'}
                                </span>
                            </div>
                        </div>
                    </section>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
