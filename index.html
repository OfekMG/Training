<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-RHR Protocol</title>
    <meta name="theme-color" content="#050507">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#030305',
                        panel: 'rgba(15, 20, 25, 0.55)',
                        cyan: { 400: '#00F0FF', 500: '#00B8FF' },
                        red: { 500: '#FF2A2A', 900: '#3A0A0A' },
                        green: { 400: '#39FF14', 900: '#0A2A0A' },
                        yellow: { 400: '#FFEA00' },
                        purple: { 400: '#B026FF' }
                    },
                    backgroundImage: {
                        'grid-pattern': 'linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px)',
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <style>
        body { 
            background-color: #030305; 
            background-image: radial-gradient(circle at 50% -20%, #1a2235 0%, #030305 70%);
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; 
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .bg-grid {
            background-size: 40px 40px;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            mask-image: linear-gradient(to bottom, transparent, black, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent 10%, black 50%, transparent 90%);
        }
        .glass-panel { 
            background: rgba(10, 14, 20, 0.6); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        ::-webkit-scrollbar { display: none; }
        
        /* Custom sleek ranges */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin: 10px 0;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -8px;
            box-shadow: 0 0 15px currentColor;
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        /* Dynamic thumb colors based on a CSS variable */
        .slider-cyan::-webkit-slider-thumb { background: #00F0FF; color: #00F0FF; }
        .slider-dynamic::-webkit-slider-thumb { background: var(--thumb-color); color: var(--thumb-color); }
    </style>
</head>
<body>
    <div class="bg-grid bg-grid-pattern"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { motion, AnimatePresence } = window.Motion;

        const useLocalStorage = (key, initialValue) => {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.error(error);
                }
            };
            return [storedValue, setValue];
        };

        // Simplified, high-impact 7-day schedules. Removed the overcomplicated 12-week cycle.
        const getScheduleForMode = (mode) => {
            const baseSchedules = {
                'Balanced': [
                    { day: 'Sun', type: 'Endurance Base', desc: 'Long steady state. Target cardiac hypertrophy.', color: 'text-cyan-400', shadow: 'shadow-cyan-400/20', baseVol: 60, maxVol: 90 },
                    { day: 'Mon', type: 'Anaerobic Cap', desc: '4x4m Intervals (Z5) with 3m rest.', color: 'text-red-500', shadow: 'shadow-red-500/20', baseVol: 30, maxVol: 35 },
                    { day: 'Tue', type: 'Zone 2 Flush', desc: 'Light spin/jog for strict metabolite clearance.', color: 'text-cyan-400', shadow: 'shadow-cyan-400/20', baseVol: 40, maxVol: 45 },
                    { day: 'Wed', type: 'Strength (Lower)', desc: 'Heavy structural loading. Primary squat/hinge.', color: 'text-purple-400', shadow: 'shadow-purple-400/20', baseVol: 45, maxVol: 45 },
                    { day: 'Thu', type: 'Strength (Upper)', desc: 'Upper mechanics. Push/pull hypertrophy ranges.', color: 'text-purple-400', shadow: 'shadow-purple-400/20', baseVol: 45, maxVol: 45 },
                    { day: 'Fri', type: 'HIIT / Sprint', desc: 'Maximum output bursts. Full recovery between sets.', color: 'text-red-500', shadow: 'shadow-red-500/20', baseVol: 20, maxVol: 20 },
                    { day: 'Sat', type: 'Neural Rest', desc: 'Zero structured physical load. Pure recovery.', color: 'text-gray-400', shadow: 'shadow-white/5', baseVol: 0, maxVol: 0 }
                ],
                'Aerobic Focus': [
                    { day: 'Sun', type: 'Endurance Engine', desc: 'Extended low-intensity volume. Nasal strict.', color: 'text-cyan-400', shadow: 'shadow-cyan-400/20', baseVol: 90, maxVol: 120 },
                    { day: 'Mon', type: 'Anaerobic Cap', desc: '4x4m Intervals (Z5) with 3m rest', color: 'text-red-500', shadow: 'shadow-red-500/20', baseVol: 35, maxVol: 40 },
                    { day: 'Tue', type: 'Zone 2 Base', desc: 'Strict Nasal Breathing steady state.', color: 'text-cyan-400', shadow: 'shadow-cyan-400/20', baseVol: 60, maxVol: 75 },
                    { day: 'Wed', type: 'Strength Maint.', desc: 'Full body mobility and compound maintenance.', color: 'text-purple-400', shadow: 'shadow-purple-400/20', baseVol: 30, maxVol: 30 },
                    { day: 'Thu', type: 'Zone 2 Flush', desc: 'Light spin/jog.', color: 'text-cyan-400', shadow: 'shadow-cyan-400/20', baseVol: 45, maxVol: 50 },
                    { day: 'Fri', type: 'HIIT / Sprint', desc: 'Max output, full recovery.', color: 'text-red-500', shadow: 'shadow-red-500/20', baseVol: 20, maxVol: 20 },
                    { day: 'Sat', type: 'Neural Rest', desc: 'Zero structured load.', color: 'text-gray-400', shadow: 'shadow-white/5', baseVol: 0, maxVol: 0 }
                ],
                'Strength Focus': [
                    { day: 'Sun', type: 'Zone 2 Base', desc: 'Active recovery. Nasal only.', color: 'text-cyan-400', shadow: 'shadow-cyan-400/20', baseVol: 45, maxVol: 50 },
                    { day: 'Mon', type: 'Strength (Lower)', desc: 'Squat/Hinge primary focus. Heavy load.', color: 'text-purple-400', shadow: 'shadow-purple-400/20', baseVol: 60, maxVol: 70 },
                    { day: 'Tue', type: 'Zone 2 Flush', desc: 'Light active recovery to clear metabolites.', color: 'text-cyan-400', shadow: 'shadow-cyan-400/20', baseVol: 30, maxVol: 30 },
                    { day: 'Wed', type: 'Strength (Upper)', desc: 'Push/Pull primary focus. Hypertrophy ranges.', color: 'text-purple-400', shadow: 'shadow-purple-400/20', baseVol: 60, maxVol: 70 },
                    { day: 'Thu', type: 'Anaerobic Maint.', desc: 'Short sprint intervals for engine preservation.', color: 'text-red-500', shadow: 'shadow-red-500/20', baseVol: 20, maxVol: 25 },
                    { day: 'Fri', type: 'Power / Full Body', desc: 'Explosive movements, plyometrics.', color: 'text-purple-400', shadow: 'shadow-purple-400/20', baseVol: 45, maxVol: 50 },
                    { day: 'Sat', type: 'Neural Rest', desc: 'Zero structured load.', color: 'text-gray-400', shadow: 'shadow-white/5', baseVol: 0, maxVol: 0 }
                ]
            };

            return baseSchedules[mode] || baseSchedules['Balanced'];
        };

        const calculateDailyProtocol = (workout, currentHRV, baseHRV) => {
            if (workout.baseVol === 0) return { volume: 0, state: 'Rest & Recover', stateColor: '#9ca3af', textClass: 'text-gray-400', instruction: workout.desc, glow: 'rgba(156, 163, 175, 0.1)' };

            const percentChange = (currentHRV - baseHRV) / baseHRV; 
            
            if (percentChange >= 0.08) {
                return { 
                    volume: workout.maxVol, 
                    state: 'Hyper-Ready', 
                    stateColor: '#39FF14',
                    textClass: 'text-green-400',
                    instruction: `${workout.desc} System optimized. End with maximum output bursts.`,
                    glow: 'rgba(57, 255, 20, 0.15)'
                };
            } else if (percentChange <= -0.08) {
                const penaltyMultiplier = Math.max(0.5, 1 + percentChange); 
                return { 
                    volume: Math.round(workout.baseVol * penaltyMultiplier), 
                    state: 'Under-Recovered', 
                    stateColor: '#FF2A2A',
                    textClass: 'text-red-500',
                    instruction: `High sympathetic drive. Cap effort intensity. Focus on structural recovery today.`,
                    glow: 'rgba(255, 42, 42, 0.15)'
                };
            }
            
            return { 
                volume: workout.baseVol, 
                state: 'Baseline Capacity', 
                stateColor: '#00F0FF',
                textClass: 'text-cyan-400',
                instruction: workout.desc,
                glow: 'rgba(0, 240, 255, 0.1)'
            };
        };

        const App = () => {
            const [baseHRV, setBaseHRV] = useLocalStorage('rhr_baseHRV', 65);
            const [dailyHRV, setDailyHRV] = useLocalStorage('rhr_dailyHRV', 65);
            const [trainingMode, setTrainingMode] = useLocalStorage('rhr_trainingMode', 'Balanced');
            
            const currentDayIndex = new Date().getDay();
            const activeSchedule = getScheduleForMode(trainingMode);
            const todayWorkout = activeSchedule[currentDayIndex];
            const activeProtocol = calculateDailyProtocol(todayWorkout, dailyHRV, baseHRV);
            
            const tomorrowIndex = (currentDayIndex + 1) % 7;
            const tomorrowWorkout = activeSchedule[tomorrowIndex];

            // Update custom CSS variable for the dynamic HRV slider
            useEffect(() => {
                document.documentElement.style.setProperty('--thumb-color', activeProtocol.stateColor);
            }, [activeProtocol.stateColor]);

            return (
                <div className="min-h-screen p-5 md:p-8 flex flex-col items-center max-w-lg mx-auto pb-20">
                    
                    {/* Header */}
                    <header className="w-full mb-8 mt-2 flex justify-between items-center">
                        <div>
                            <h1 className="text-2xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600 uppercase drop-shadow-[0_0_10px_rgba(0,240,255,0.4)]">
                                Neuro-RHR
                            </h1>
                            <div className="text-[10px] text-gray-500 font-bold uppercase tracking-[0.3em] mt-1">Protocol Dashboard</div>
                        </div>
                        
                        <div className="relative group">
                            <select 
                                value={trainingMode} 
                                onChange={(e) => setTrainingMode(e.target.value)}
                                className="appearance-none bg-black/40 border border-white/10 text-white py-2 pl-4 pr-10 rounded-xl text-xs font-bold uppercase tracking-wider focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 cursor-pointer backdrop-blur-md transition-all group-hover:border-white/30"
                            >
                                <option value="Balanced">Balanced Base</option>
                                <option value="Aerobic Focus">Aerobic Block</option>
                                <option value="Strength Focus">Strength Block</option>
                            </select>
                            <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 group-hover:text-cyan-400 transition-colors">
                                <svg className="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                                    <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
                                </svg>
                            </div>
                        </div>
                    </header>

                    {/* ANS Readiness Panel */}
                    <section className="w-full glass-panel rounded-2xl p-6 mb-6">
                        <div className="flex justify-between items-end mb-6">
                            <div>
                                <h2 className="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">ANS Readiness</h2>
                                <div className={`text-sm font-black uppercase tracking-widest ${activeProtocol.textClass} drop-shadow-[0_0_8px_currentColor]`}>
                                    {activeProtocol.state}
                                </div>
                            </div>
                            <div className="text-right">
                                <div className="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1">Variance</div>
                                <div className="text-lg font-mono font-bold text-white">
                                    {((dailyHRV - baseHRV) / baseHRV * 100).toFixed(1)}%
                                </div>
                            </div>
                        </div>
                        
                        <div className="space-y-6">
                            {/* Base HRV */}
                            <div className="relative">
                                <div className="flex justify-between text-xs mb-3">
                                    <span className="text-gray-400 font-medium">14-Day Baseline HRV</span>
                                    <span className="font-mono text-gray-300">{baseHRV} ms</span>
                                </div>
                                <input 
                                    type="range" min="30" max="150" value={baseHRV} 
                                    onChange={(e) => setBaseHRV(Number(e.target.value))}
                                    className="slider-cyan"
                                />
                            </div>
                            
                            {/* Daily HRV */}
                            <div className="relative">
                                <div className="flex justify-between text-xs mb-3">
                                    <span className="text-white font-bold">Morning HRV (RMSSD)</span>
                                    <span className={`font-mono font-bold ${activeProtocol.textClass}`}>{dailyHRV} ms</span>
                                </div>
                                <input 
                                    type="range" min="30" max="150" value={dailyHRV} 
                                    onChange={(e) => setDailyHRV(Number(e.target.value))}
                                    className="slider-dynamic"
                                />
                            </div>
                        </div>
                    </section>

                    {/* Today's Workout Card */}
                    <AnimatePresence mode="wait">
                        <motion.section 
                            key={trainingMode + currentDayIndex + activeProtocol.state}
                            initial={{ y: 15, opacity: 0, scale: 0.98 }}
                            animate={{ y: 0, opacity: 1, scale: 1 }}
                            exit={{ y: -15, opacity: 0, scale: 0.98 }}
                            transition={{ duration: 0.4, ease: [0.23, 1, 0.32, 1] }}
                            className="w-full glass-panel rounded-3xl p-7 relative overflow-hidden flex flex-col justify-between min-h-[220px]"
                            style={{
                                boxShadow: `0 10px 40px -10px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05), inset 0 0 40px ${activeProtocol.glow}`
                            }}
                        >
                            {/* Giant background text for aesthetic */}
                            <div className="absolute -top-4 -right-4 text-9xl font-black text-white opacity-[0.015] pointer-events-none select-none tracking-tighter">
                                {todayWorkout.day.toUpperCase()}
                            </div>

                            <div>
                                <div className="flex items-center space-x-3 mb-2">
                                    <div className={`w-2 h-2 rounded-full ${todayWorkout.color} shadow-[0_0_10px_currentColor]`}></div>
                                    <h2 className="text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em]">Today's Protocol</h2>
                                </div>
                                <h3 className={`text-3xl font-black mb-4 tracking-tight ${todayWorkout.color} drop-shadow-md`}>
                                    {todayWorkout.type}
                                </h3>
                                
                                <p className="text-gray-300 text-sm font-medium leading-relaxed max-w-[90%] mb-8">
                                    {activeProtocol.instruction}
                                </p>
                            </div>
                            
                            <div className="mt-auto border-t border-white/10 pt-4 flex items-end justify-between">
                                <div>
                                    <span className="text-[10px] text-gray-500 uppercase font-bold tracking-[0.2em] block mb-1">Target Volume</span>
                                    {activeProtocol.volume > 0 ? (
                                        <div className="flex items-baseline space-x-1">
                                            <span className={`text-5xl font-mono font-black tracking-tighter ${activeProtocol.textClass}`}>
                                                {activeProtocol.volume}
                                            </span>
                                            <span className="text-sm text-gray-500 font-bold uppercase ml-1">Min</span>
                                        </div>
                                    ) : (
                                        <span className={`text-3xl font-mono font-black tracking-tighter ${activeProtocol.textClass}`}>
                                            OFF
                                        </span>
                                    )}
                                </div>
                                <div className="text-right">
                                     <span className="text-[10px] text-gray-500 uppercase font-bold tracking-[0.2em] block mb-1">State</span>
                                     <span className="text-xs text-white font-bold uppercase tracking-wider">{activeProtocol.state.split(' ')[0]}</span>
                                </div>
                            </div>
                        </motion.section>
                    </AnimatePresence>

                    {/* Tomorrow Preview */}
                    <section className="w-full mt-6 flex">
                        <div className="w-full bg-black/30 border border-white/5 rounded-2xl p-5 flex items-center justify-between backdrop-blur-sm hover:bg-black/40 transition-colors">
                            <div className="flex items-center space-x-4">
                                <div className="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center border border-white/10">
                                    <svg className="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path>
                                    </svg>
                                </div>
                                <div>
                                    <h4 className="text-[9px] text-gray-500 uppercase tracking-widest font-bold mb-1">Tomorrow • {tomorrowWorkout.day}</h4>
                                    <span className={`text-sm font-bold tracking-wide ${tomorrowWorkout.color}`}>{tomorrowWorkout.type}</span>
                                </div>
                            </div>
                            <div className="text-right">
                                <span className="text-sm font-mono text-gray-300 font-bold">
                                    {tomorrowWorkout.baseVol > 0 ? `${tomorrowWorkout.baseVol}m` : 'REST'}
                                </span>
                            </div>
                        </div>
                    </section>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
