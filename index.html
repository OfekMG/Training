<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-RHR Optimization Protocol v2.0</title>
    <meta name="theme-color" content="#050507">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#050507',
                        cyan: { 400: '#45F3FF', 500: '#00E5FF', 900: '#003333' },
                        red: { 400: '#FF4545', 500: '#FF2A2A', 900: '#330000' },
                        green: { 400: '#39FF14', 500: '#32E512', 900: '#0A3300' },
                        purple: { 400: '#B026FF', 900: '#2A0040' }
                    },
                    fontFamily: {
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", 'monospace'],
                        sans: ['-apple-system', 'BlinkMacSystemFont', "Segoe UI", 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { 
            background-color: #050507; 
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 229, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(176, 38, 255, 0.03) 0%, transparent 50%);
            color: #fff; 
            min-height: 100vh;
        }
        .glass-panel { 
            background: rgba(15, 20, 25, 0.6); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7);
        }
        ::-webkit-scrollbar { display: none; }
        
        /* Custom Cyberpunk Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin: 10px 0;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 8px;
            border-radius: 2px;
            background: #00E5FF;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
        }
        input[type=range].red-slider::-webkit-slider-thumb {
            background: #FF2A2A;
            box-shadow: 0 0 12px rgba(255, 42, 42, 0.6);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;
        const { motion, AnimatePresence } = window.Motion;

        // Utility: Local Storage Hook with complex object support
        const useLocalStorage = (key, initialValue) => {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.error(error);
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.error(error);
                }
            };
            return [storedValue, setValue];
        };

        // Algorithm: Calculate Rolling Averages
        const calculateAverages = (historyData) => {
            if (!historyData || historyData.length === 0) return { hrv: 65, rhr: 50 };
            const recent = historyData.slice(-7); // 7-day rolling acute load
            const hrvSum = recent.reduce((sum, entry) => sum + entry.hrv, 0);
            const rhrSum = recent.reduce((sum, entry) => sum + entry.rhr, 0);
            return {
                hrv: Math.round(hrvSum / recent.length),
                rhr: Math.round(rhrSum / recent.length)
            };
        };

        // Algorithm: Daily Readiness Engine (0-100 Score)
        const calculateReadiness = (dailyHRV, dailyRHR, baseHRV, baseRHR) => {
            // HRV Factor: Higher is better. +15% is excellent, -15% is poor.
            const hrvDiff = (dailyHRV - baseHRV) / baseHRV;
            let hrvScore = 50 + (hrvDiff * 100 * 2.5); 
            
            // RHR Factor: Lower is better. +10% is poor, -10% is excellent.
            const rhrDiff = (baseRHR - dailyRHR) / baseRHR; // Inverted
            let rhrScore = 50 + (rhrDiff * 100 * 4);

            // Blend: HRV is a more sensitive autonomic indicator, weight it slightly higher
            let score = Math.round((hrvScore * 0.6) + (rhrScore * 0.4));
            
            // Constrain 0-100
            score = Math.max(0, Math.min(100, score));

            if (score >= 75) return { score, state: 'Hyper-Ready', color: 'text-green-400', bg: 'bg-green-900/20', border: 'border-green-500/30' };
            if (score >= 40) return { score, state: 'Baseline Capacity', color: 'text-cyan-400', bg: 'bg-cyan-900/20', border: 'border-cyan-500/30' };
            return { score, state: 'Under-Recovered', color: 'text-red-500', bg: 'bg-red-900/20', border: 'border-red-500/30' };
        };

        // Sub-Component: SVG Sparkline Chart
        const TrendChart = ({ data, dataKey, strokeColor }) => {
            if (data.length < 2) return <div className="h-16 flex items-center justify-center text-xs text-gray-600">Need more data</div>;
            
            const max = Math.max(...data.map(d => d[dataKey]));
            const min = Math.min(...data.map(d => d[dataKey]));
            const range = max - min || 1;
            const width = 100;
            const height = 40;

            const points = data.map((d, i) => {
                const x = (i / (data.length - 1)) * width;
                const y = height - ((d[dataKey] - min) / range) * height;
                return `${x},${y}`;
            }).join(' ');

            return (
                <svg viewBox={`0 -5 100 50`} className="w-full h-16 overflow-visible">
                    <polyline fill="none" stroke={strokeColor} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" points={points} />
                    {data.map((d, i) => {
                        const x = (i / (data.length - 1)) * width;
                        const y = height - ((d[dataKey] - min) / range) * height;
                        return <circle key={i} cx={x} cy={y} r="2" fill="#050507" stroke={strokeColor} strokeWidth="1.5" />
                    })}
                </svg>
            );
        };

        const App = () => {
            // State initialization
            const [history, setHistory] = useLocalStorage('rhr_history', []);
            const [checklist, setChecklist] = useLocalStorage('rhr_checklist_v2', {});
            
            // Form state for today's entry
            const [inputHRV, setInputHRV] = useState(65);
            const [inputRHR, setInputRHR] = useState(50);
            
            // Program constraints
            const TOTAL_WEEKS = 12;
            const PROGRAM_START_DATE = useMemo(() => {
                // Initialize default start date to 30 days ago to align with a 12 week mid-point if first load
                const stored = window.localStorage.getItem('rhr_prog_start');
                if (stored) return new Date(JSON.parse(stored));
                const date = new Date();
                date.setDate(date.getDate() - 30);
                window.localStorage.setItem('rhr_prog_start', JSON.stringify(date.toISOString()));
                return date;
            }, []);

            const currentWeek = useMemo(() => {
                const diffTime = Math.abs(new Date() - PROGRAM_START_DATE);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                return Math.min(TOTAL_WEEKS, Math.max(1, Math.floor(diffDays / 7) + 1));
            }, [PROGRAM_START_DATE]);

            // Derived Baseline & Readiness
            const rollingAverages = useMemo(() => calculateAverages(history), [history]);
            const readiness = useMemo(() => calculateReadiness(inputHRV, inputRHR, rollingAverages.hrv, rollingAverages.rhr), [inputHRV, inputRHR, rollingAverages]);

            const handleSaveToday = () => {
                const todayStr = new Date().toISOString().split('T')[0];
                const newEntry = { date: todayStr, hrv: inputHRV, rhr: inputRHR, score: readiness.score };
                
                setHistory(prev => {
                    const filtered = prev.filter(entry => entry.date !== todayStr);
                    return [...filtered, newEntry].sort((a, b) => new Date(a.date) - new Date(b.date)).slice(-14); // Keep last 14 days
                });
            };

            const toggleChecklist = (id) => setChecklist(prev => ({ ...prev, [id]: !prev[id] }));

            const protocols = [
                { id: 'sun', label: 'Morning Sunlight (15m)', type: 'Circadian' },
                { id: 'nsdr', label: 'NSDR / Yoga Nidra (20m)', type: 'Parasympathetic' },
                { id: 'sauna', label: 'Sauna (20m @ 80°C+)', type: 'Hormetic' },
                { id: 'bacopa', label: 'Bacopa Monnieri / Stack', type: 'Nootropic' },
                { id: 'fast', label: '4hr Pre-Sleep Fast', type: 'Metabolic' },
                { id: 'zone2', label: 'Zone 2 Cardio (45m+)', type: 'Aerobic Base' }
            ];

            return (
                <div className="min-h-screen p-4 md:p-6 flex flex-col items-center max-w-xl mx-auto space-y-6 pb-20">
                    
                    {/* Header & Macrocycle Tracker */}
                    <header className="w-full mt-4">
                        <div className="flex justify-between items-end mb-4">
                            <div>
                                <h1 className="text-2xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600 uppercase">
                                    Neuro-RHR
                                </h1>
                                <p className="text-[10px] text-cyan-500/70 uppercase tracking-widest font-mono mt-1">Autonomic Operating System</p>
                            </div>
                            <div className="text-right">
                                <span className="text-xs text-gray-500 font-mono uppercase">Macrocycle</span>
                                <div className="text-lg font-bold text-white tracking-wider">Wk {currentWeek}<span className="text-gray-600 text-sm">/{TOTAL_WEEKS}</span></div>
                            </div>
                        </div>
                        
                        {/* 12-Week Progress Bar */}
                        <div className="w-full h-1.5 bg-gray-900 rounded-full overflow-hidden flex">
                            {[...Array(TOTAL_WEEKS)].map((_, i) => (
                                <div 
                                    key={i} 
                                    className={`h-full flex-1 border-r border-obsidian last:border-0 transition-colors duration-1000
                                        ${i + 1 < currentWeek ? 'bg-cyan-700' : i + 1 === currentWeek ? 'bg-cyan-400' : 'bg-transparent'}`}
                                />
                            ))}
                        </div>
                    </header>

                    {/* Main Readiness Engine */}
                    <motion.section 
                        className={`w-full glass-panel rounded-2xl p-6 border transition-all duration-500 ${readiness.border} ${readiness.bg}`}
                        layout
                    >
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-xs font-bold text-gray-400 uppercase tracking-widest">System Readiness</h2>
                            <span className={`text-[10px] px-2 py-1 rounded border font-bold uppercase tracking-widest ${readiness.color} ${readiness.border}`}>
                                {readiness.state}
                            </span>
                        </div>

                        <div className="flex items-center justify-center py-4">
                            <div className="relative flex items-center justify-center">
                                <svg className="w-32 h-32 transform -rotate-90">
                                    <circle cx="64" cy="64" r="58" stroke="currentColor" strokeWidth="4" fill="transparent" className="text-gray-800" />
                                    <circle 
                                        cx="64" cy="64" r="58" stroke="currentColor" strokeWidth="4" fill="transparent" 
                                        strokeDasharray="364" 
                                        strokeDashoffset={364 - (364 * readiness.score) / 100}
                                        className={`${readiness.color} transition-all duration-1000 ease-out`} 
                                        strokeLinecap="round"
                                    />
                                </svg>
                                <div className="absolute flex flex-col items-center">
                                    <span className="text-4xl font-mono font-bold tracking-tighter">{readiness.score}</span>
                                    <span className="text-[9px] text-gray-500 uppercase tracking-widest">Score</span>
                                </div>
                            </div>
                        </div>

                        {/* Sliders */}
                        <div className="space-y-6 mt-4">
                            <div className="space-y-2">
                                <div className="flex justify-between items-baseline">
                                    <label className="text-xs font-bold text-gray-300 uppercase tracking-wider">Morning HRV (RMSSD)</label>
                                    <span className="font-mono text-cyan-400">{inputHRV} <span className="text-gray-600 text-[10px]">ms</span></span>
                                </div>
                                <input type="range" min="20" max="150" value={inputHRV} onChange={(e) => setInputHRV(Number(e.target.value))} />
                                <div className="flex justify-between text-[10px] text-gray-600 font-mono">
                                    <span>7-Day Base: {rollingAverages.hrv}</span>
                                    <span>{((inputHRV - rollingAverages.hrv) / rollingAverages.hrv * 100).toFixed(1)}%</span>
                                </div>
                            </div>

                            <div className="space-y-2">
                                <div className="flex justify-between items-baseline">
                                    <label className="text-xs font-bold text-gray-300 uppercase tracking-wider">Resting Heart Rate</label>
                                    <span className="font-mono text-red-400">{inputRHR} <span className="text-gray-600 text-[10px]">bpm</span></span>
                                </div>
                                <input type="range" min="35" max="85" value={inputRHR} onChange={(e) => setInputRHR(Number(e.target.value))} className="red-slider" />
                                <div className="flex justify-between text-[10px] text-gray-600 font-mono">
                                    <span>7-Day Base: {rollingAverages.rhr}</span>
                                    <span>{((inputRHR - rollingAverages.rhr) / rollingAverages.rhr * 100).toFixed(1)}%</span>
                                </div>
                            </div>
                        </div>

                        <button 
                            onClick={handleSaveToday}
                            className="w-full mt-6 bg-white/5 hover:bg-white/10 border border-white/10 text-white py-3 rounded-lg text-xs font-bold uppercase tracking-widest transition-all active:scale-95"
                        >
                            Log Daily Biometrics
                        </button>
                    </motion.section>

                    {/* Dynamic Protocol Prescription */}
                    <section className="w-full glass-panel rounded-xl p-5 border-l-4 border-l-cyan-500">
                        <h3 className="text-[10px] text-cyan-500 uppercase tracking-widest font-bold mb-2">Prescription Engine</h3>
                        {readiness.score >= 75 ? (
                            <p className="text-sm text-gray-300 leading-relaxed">
                                High parasympathetic tone detected. System is primed for peak sympathetic loading. Execute <strong className="text-white">HIIT</strong> or heavy structural lifts. Avoid active recovery.
                            </p>
                        ) : readiness.score >= 40 ? (
                            <p className="text-sm text-gray-300 leading-relaxed">
                                Autonomic balance is stable. Proceed with standard macrocycle loading. Prioritize <strong className="text-white">Zone 2 Base</strong> building to expand stroke volume.
                            </p>
                        ) : (
                            <p className="text-sm text-gray-300 leading-relaxed">
                                Sympathetic overreach detected. Cap effort intensity. Immediately deploy <strong className="text-white">5 mins of Physiological Sighs</strong> post-workout and prioritize NSDR to force parasympathetic rebound.
                            </p>
                        )}
                    </section>

                    {/* Historical Trends */}
                    {history.length > 0 && (
                        <section className="w-full glass-panel rounded-xl p-5">
                            <h3 className="text-xs font-bold text-gray-400 mb-4 uppercase tracking-widest flex items-center justify-between">
                                Biometric Trends <span className="text-[9px] text-gray-600">Last 14 Logs</span>
                            </h3>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-black/40 p-3 rounded-lg border border-gray-800/50">
                                    <div className="text-[10px] text-cyan-500 uppercase tracking-widest mb-2">HRV Trend</div>
                                    <TrendChart data={history} dataKey="hrv" strokeColor="#00E5FF" />
                                </div>
                                <div className="bg-black/40 p-3 rounded-lg border border-gray-800/50">
                                    <div className="text-[10px] text-red-500 uppercase tracking-widest mb-2">RHR Trend</div>
                                    <TrendChart data={history} dataKey="rhr" strokeColor="#FF2A2A" />
                                </div>
                            </div>
                        </section>
                    )}

                    {/* Huberman / Galpin Optimization Checklist */}
                    <section className="w-full glass-panel rounded-xl p-5">
                        <h2 className="text-xs font-bold text-gray-400 mb-4 uppercase tracking-widest border-b border-gray-800/50 pb-2">Optimization Vectors</h2>
                        <div className="space-y-3">
                            {protocols.map(item => (
                                <label key={item.id} className="flex items-center justify-between cursor-pointer group p-2 hover:bg-white/5 rounded transition-colors">
                                    <div className="flex items-center space-x-3">
                                        <div className={`w-5 h-5 rounded border flex items-center justify-center transition-all duration-300 ${checklist[item.id] ? 'bg-cyan-500 border-cyan-500 shadow-[0_0_10px_rgba(0,229,255,0.4)]' : 'border-gray-600 group-hover:border-cyan-500'}`}>
                                            {checklist[item.id] && <svg className="w-3 h-3 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7" /></svg>}
                                        </div>
                                        <span className={`text-sm transition-colors ${checklist[item.id] ? 'text-white font-medium' : 'text-gray-400 group-hover:text-gray-200'}`}>{item.label}</span>
                                    </div>
                                    <span className="text-[9px] uppercase tracking-widest text-gray-600 font-mono">{item.type}</span>
                                    <input type="checkbox" className="hidden" checked={!!checklist[item.id]} onChange={() => toggleChecklist(item.id)} />
                                </label>
                            ))}
                        </div>
                    </section>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
